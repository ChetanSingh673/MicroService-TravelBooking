apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: frontend-stable
  namespace: monitoring
  labels:
    release: monitoring
spec:
  jobName: travelbooking-frontend-stable
  interval: 30s
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      static:
        - http://frontend-stable-service.travel-booking.svc.cluster.local:80/
---
