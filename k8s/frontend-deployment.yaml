apiVersion: apps/v1
kind: Deployment
metadata: 
  name: frontend-deployment
  namespace: travel-booking
  labels:
    app: frontend 
spec:
  repliacs: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      - name: frontend
        image: chetansingh673/travel-frontend:build-4
        imagePullPolicy: Always         
        ports:
          - containerPort: 80
        env:
          - name: NODE_ENV
            value: production  