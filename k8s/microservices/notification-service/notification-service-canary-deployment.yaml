apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-canary-deployment 
  namespace: travel-booking
  labels:
    app: notification-service
    version: canary
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: notification-service
      version: canary
  template:
    metadata:
      labels:
        app: notification-service
        version: canary
    spec:
      containers:
       - name: notification-service
         image: chetansingh673/travel-notification-service:v1-build-1
         imagePullPolicy: Always
         ports:
           - containerPort: 3005
         resources:
           requests:
            cpu: 100m
            memory: 128Mi
           limits: 
            cpu: 500m
            memory: 512Mi
         
         livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3       

         readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

         envFrom:
           - configMapRef:
               name: notification-service-config
           - secretRef:
               name: notification-service-secret     