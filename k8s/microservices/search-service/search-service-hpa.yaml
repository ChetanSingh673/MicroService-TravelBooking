apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search-service-autoscaler
  namespace: travel-booking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-service-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 50