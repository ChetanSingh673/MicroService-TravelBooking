
apiVersion: v1
kind: Pod
metadata:
  name: memory-stress
  namespace: monitoring
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: polinux/stress
      command: ["stress"]
      args:
        - "--vm"
        - "1"
        - "--vm-bytes"
        - "128M"
        - "--vm-keep"
        - "--timeout"
        - "300s"
      resources:
        requests:
          cpu: "50m"
          memory: "160Mi"
        limits:
          cpu: "200m"
          memory: "192Mi"