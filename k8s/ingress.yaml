apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travel-booking-ingress
  namespace: travel-booking
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/load-balancer-name: travel-alb
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:560185625463:certificate/REPLACE-WITH-YOUR-CERTIFICATE-ID
spec:
  ingressClassName: alb
  rules:
    - host: cloudmella.store
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: user.cloudmella.store
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-service-service
                port:
                  number: 3001
    - host: search.cloudmella.store
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: search-service-service
                port:
                  number: 3002
    - host: booking.cloudmella.store
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: booking-service-service
                port:
                  number: 3003
    - host: payment.cloudmella.store
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-service-service
                port:
                  number: 3004
    - host: notification.cloudmella.store
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notification-service-service
                port:
                  number: 3005